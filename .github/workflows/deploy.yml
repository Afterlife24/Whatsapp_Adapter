name: Deploy WhatsApp Adapter to EC2

# Triggers a rebuild on the Dograh EC2 by dispatching an event to the dograh repo,
# where the self-hosted runner is registered.

on:
  push:
    branches: [main]

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dograh deploy workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: Afterlife24/AgentPlatform
          event-type: whatsapp-adapter-updated
          client-payload: '{"ref": "${{ github.sha }}"}'
